allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true

# Deprecations we can't act on yet; keeps `pnpm install` output clean.
allowedDeprecatedVersions:
  # ESLint 10 is out, but eslint-config-next's react, jsx-a11y and import plugins only support ESLint 9.
  eslint: 9.39.5
  # Pulled in by drizzle-kit, which @payloadcms/db-postgres pins.
  '@esbuild-kit/core-utils': 3.3.2
  '@esbuild-kit/esm-loader': 2.6.5

auditConfig:
  # Accepted advisories with no compatible fix. Rationale and review date: docs/DEPENDENCIES.md.
  ignoreGhsas:
    - GHSA-834v-8h66-3h79 # happy-dom via @lexical/headless
    - GHSA-c8p4-j97h-3vg8 # happy-dom via @lexical/headless
    - GHSA-g3hv-75wg-m249 # minimatch via ESLint tooling (dev only)

overrides:
  # Security floors for transitive dependencies; see docs/DEPENDENCIES.md.
  dompurify: ^3.4.17
  esbuild: ^0.25.0
  undici: ^7.30.1
